name: Automação Autovision

on:
  workflow_dispatch:

jobs:
  executar-automacao:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # =====================================================
      # BAIXAR CÓDIGO
      # =====================================================

      - name: Checkout do repositório
        uses: actions/checkout@v4

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # =====================================================
      # MICROSOFT EDGE
      # =====================================================

      - name: Instalar Microsoft Edge
        uses: browser-actions/setup-edge@v1

      # =====================================================
      # DEPENDÊNCIAS
      # =====================================================

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # EXECUTAR
      # =====================================================

      - name: Executar main.py
        env:
          AUTOVISION_USUARIO: ${{ secrets.AUTOVISION_USUARIO }}
          AUTOVISION_SENHA: ${{ secrets.AUTOVISION_SENHA }}
          NEXUS_EMAIL: ${{ secrets.NEXUS_EMAIL }}
          NEXUS_SENHA: ${{ secrets.NEXUS_SENHA }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

        run: |
          python main.py

      # =====================================================
      # SALVAR RESULTADOS
      # =====================================================

      - name: Salvar relatórios gerados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-automacao
          path: |
            *.xlsx
            *.html
            *.htm
          if-no-files-found: ignore
