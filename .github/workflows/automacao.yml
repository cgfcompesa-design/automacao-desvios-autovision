







name: Auditoria Autovision

on:
  workflow_dispatch:

jobs:

  auditoria:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Microsoft Edge
        run: |
          sudo apt-get update

          curl -fsSL \
            https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/microsoft-prod.gpg > /dev/null

          sudo chmod go+r /usr/share/keyrings/microsoft-prod.gpg

          sudo sh -c '
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/repos/edge stable main" \
            > /etc/apt/sources.list.d/microsoft-edge.list
          '

          sudo apt-get update

          sudo apt-get install -y microsoft-edge-stable

      - name: Verificar navegador
        run: |
          microsoft-edge --version || true
          google-chrome --version || true

      - name: Executar main.py
        env:
          AUTOVISION_USUARIO: ${{ secrets.AUTOVISION_USUARIO }}
          AUTOVISION_SENHA: ${{ secrets.AUTOVISION_SENHA }}
          NEXUS_EMAIL: ${{ secrets.NEXUS_EMAIL }}
          NEXUS_SENHA: ${{ secrets.NEXUS_SENHA }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python main.py

      - name: Salvar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-auditoria
          path: |
            resultados/**
            analises_telemetria/**
            relatorios_posicao/**
            html/**
            excel/**
          if-no-files-found: warn













