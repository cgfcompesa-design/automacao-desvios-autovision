workflow.yml
name: Auditoria AutoVision
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1-5'
jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Executar main.py
        env:
          AUTOVISION_USUARIO: ${{ secrets.AUTOVISION_USUARIO }}
          AUTOVISION_SENHA: ${{ secrets.AUTOVISION_SENHA }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python main.py
      - name: Salvar resultados sempre
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-auditoria
          path: |
            resultados/**
            relatorios_posicao/**
          if-no-files-found: warn
