name: Automação AutoVision - Auditoria

on:
  workflow_dispatch:

  schedule:
    - cron: "0 11 * * 1-5"

jobs:
  executar:

    runs-on: windows-latest

    timeout-minutes: 120

    steps:

      # ======================================================
      # 1. BAIXAR REPOSITÓRIO
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ======================================================
      # 3. DEPENDÊNCIAS
      # ======================================================

      - name: Instalar dependências
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 4. VERIFICAR EDGE
      # ======================================================

      - name: Verificar Microsoft Edge
        shell: powershell
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"

          if (!(Test-Path $edge)) {
              $edge = "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe"
          }

          if (!(Test-Path $edge)) {
              Write-Error "Microsoft Edge não encontrado."
              exit 1
          }

          & $edge --version


      # ======================================================
      # 5. CRIAR PASTAS
      # ======================================================

      - name: Criar diretórios
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path html
          New-Item -ItemType Directory -Force -Path excel
          New-Item -ItemType Directory -Force -Path logs


      # ======================================================
      # 6. EXECUTAR AUTOMAÇÃO
      # ======================================================

      - name: Executar main.py
        env:
          AUTOVISION_USUARIO: ${{ secrets.AUTOVISION_USUARIO }}
          AUTOVISION_SENHA: ${{ secrets.AUTOVISION_SENHA }}

          NEXUS_EMAIL: ${{ secrets.NEXUS_EMAIL }}
          NEXUS_SENHA: ${{ secrets.NEXUS_SENHA }}

          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

        shell: powershell
        run: |
          python main.py 2>&1 | Tee-Object -FilePath logs\execucao.log

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }


      # ======================================================
      # 7. GUARDAR HTMLS
      # ======================================================

      - name: Upload HTMLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autovision-html
          path: html/
          if-no-files-found: warn


      # ======================================================
      # 8. GUARDAR EXCEL
      # ======================================================

      - name: Upload Excel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-excel
          path: excel/
          if-no-files-found: warn


      # ======================================================
      # 9. GUARDAR LOG
      # ======================================================

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-execucao
          path: logs/
          if-no-files-found: warn
