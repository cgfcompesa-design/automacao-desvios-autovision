Arquivos com os desvios, nem estão salvos no GitHub repositório nem na planilha google

Isso indica que o problema não está apenas no upload para o Google Sheets: o fluxo atual provavelmente não está garantindo a geração dos arquivos de resultado antes do fim da execução. Por isso não há arquivos para o artifact do GitHub nem dados para enviar à planilha.

Vou corrigir o fluxo para que, mesmo quando não houver desvios, ele:

gere os arquivos Excel de saída;
salve-os em uma pasta fixa, por exemplo resultados/;
envie os dados ao Google Sheets;
faça o GitHub Actions publicar essa pasta como artifact;
registre claramente no log o caminho e a quantidade de registros gerados.

Corrigi o fluxo.

O principal problema era este:

if telemetria.empty:
    return None

Quando nenhum registro era extraído, o programa encerrava antes de gerar os arquivos e antes de enviar os resultados ao Google Sheets.

Agora o fluxo foi alterado para:

AutoVision
    ↓
HTMLs
    ↓
Auditoria
    ↓
GERAR EXCEL SEMPRE
    ↓
resultados/
    ├── auditoria_telemetria.xlsx
    ├── abastecimento_x_telemetria.xlsx
    ├── paradas_motor_ligado.xlsx
    └── unificado_desvios.xlsx
    ↓
Enviar ao Google Sheets
    ↓
GitHub Artifact

Também corrigi o carregamento das placas: agora elas são obtidas automaticamente da URL da Telemetria Ociosidade, em vez de permanecerem fixas em:

PLACAS = [
    "PCU4649",
    "SOA2E34",
    "RZV5J07",
]

Agora:

PLACAS = []

e o programa lê a coluna PLACA diretamente da sua planilha.

