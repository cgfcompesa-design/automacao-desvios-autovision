GitHub Actions

Coloque o arquivo workflow.yml dentro de:

.github/workflows/auditoria.yml

O upload agora usa:

- name: Salvar resultados sempre
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: resultados-auditoria
    path: |
      resultados/**
      relatorios_posicao/**
  if-no-files-found: warn

Assim, mesmo que alguma placa apresente erro, ou mesmo que o Google Sheets falhe, os arquivos existentes serão preservados como Artifact.

