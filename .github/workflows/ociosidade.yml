name: Automacao de Ociosidade

on:
  workflow_dispatch:

jobs:
  executar-ociosidade:
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

      # Configure estes valores nos Secrets do GitHub
      AUTOVISION_USUARIO: ${{ secrets.AUTOVISION_USUARIO }}
      AUTOVISION_SENHA: ${{ secrets.AUTOVISION_SENHA }}

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Atualizar pip
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }
          else {
            pip install pandas requests selenium
          }

      - name: Verificar Python
        shell: pwsh
        run: |
          python --version
          python -c "import sys; print(sys.stdout.encoding)"

      - name: Executar automacao
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          python ociosidade.py
