name: Extrair Ociosidade AutoVision

on:

  workflow_dispatch:

  schedule:

    - cron: "0 10 * * 1-5"

jobs:

  executar:

    runs-on: windows-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4


      - name: Configurar Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests selenium


      - name: Executar
        env:

          AUTOVISION_USUARIO: ${{ secrets.AUTOVISION_USUARIO }}

          AUTOVISION_SENHA: ${{ secrets.AUTOVISION_SENHA }}

          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}

        run: |
          python ociosidade.py
