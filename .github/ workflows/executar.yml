
name: Automacao de Desvios Autovision

on:
  workflow_dispatch:

  schedule:
    # Executa diariamente às 10:00 UTC
    # 07:00 no horário de Brasília
    - cron: "0 10 * * *"

jobs:
  executar:
    name: Executar análise de desvios
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 - BAIXAR O CÓDIGO
      # ============================================================
      - name: Checkout do projeto
        uses: actions/checkout@v4

      # ============================================================
      # 2 - CONFIGURAR PYTHON
      # ============================================================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # ============================================================
      # 3 - INSTALAR DEPENDÊNCIAS
      # ============================================================
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ============================================================
      # 4 - EXECUTAR PYTHON
      # ============================================================
      - name: Executar automação
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}

          AUTOVISION_URL: ${{ secrets.AUTOVISION_URL }}
          AUTOVISION_USUARIO: ${{ secrets.AUTOVISION_USUARIO }}
          AUTOVISION_SENHA: ${{ secrets.AUTOVISION_SENHA }}

        run: |
          python main.py
